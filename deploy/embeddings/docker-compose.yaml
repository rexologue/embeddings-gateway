# Embeddings engine: one vLLM pooling server and the Prometheus that scrapes it.
#
# vLLM itself is configured by serve_embeddings.sh (a copy of
# serve_embeddings.example.sh, not in git); .env only says which image, which
# weights, which GPU and which host port.

services:
  embeddings-vllm:
    image: ${EMBEDDINGS_VLLM_IMAGE}
    container_name: ${EMBEDDINGS_CONTAINER_NAME}
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /serve_embeddings.sh"]
    runtime: nvidia
    shm_size: '2gb'

    environment:
      # Only these GPUs are visible inside the container.
      NVIDIA_VISIBLE_DEVICES: ${EMBEDDINGS_GPU_DEVICES:-all}
      # Read by serve_embeddings.sh as API_KEY.
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      # Lets the allocator give memory back between batches of different
      # sizes - matters on a GPU shared with other engines.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    # /health, not /v1/models: vLLM does not ask for the API key there.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    ports:
      - "${EMBEDDINGS_HOST}:${EMBEDDINGS_HTTP_PORT}:8000"

    volumes:
      - ${EMBEDDINGS_MODEL_PATH}:/model:ro
      - ./serve_embeddings.sh:/serve_embeddings.sh:ro

    networks:
      - embeddings


  embeddings-vllm-prometheus:
    image: ${EMBEDDINGS_PROMETHEUS_IMAGE}
    container_name: ${EMBEDDINGS_PROMETHEUS_CONTAINER_NAME}
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "${EMBEDDINGS_HOST}:${EMBEDDINGS_PROMETHEUS_HTTP_PORT}:9090"

    volumes:
      - ./configs/prometheus-vllm.yaml:/etc/prometheus/prometheus.yml:ro
      - embeddings-vllm-prometheus-data:/prometheus

    networks:
      - embeddings


volumes:
  embeddings-vllm-prometheus-data:

networks:
  embeddings:
    driver: bridge
