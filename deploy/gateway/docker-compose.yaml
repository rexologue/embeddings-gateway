services:
  embeddings-gateway:
    build:
      context: ../../gateway
    container_name: ${GATEWAY_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      embeddings-gateway-loki:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    env_file:
      - path: .env
        required: false
    ports:
      - "${GATEWAY_HOST}:${GATEWAY_HTTP_PORT}:8080"
    extra_hosts:
      - "host.docker.gateway:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - gateway

  # The metrics store of the deployment, VictoriaMetrics single-node: it
  # scrapes the gateway's own metrics (/gateway/metrics) and the engine's (vLLM
  # /metrics) itself and answers Grafana as a Prometheus datasource. Not
  # Prometheus: its TSDB does not support NFS, VictoriaMetrics storage does.
  #
  # The engine runs in another compose stack and is scraped through the host,
  # at host:port of GATEWAY_BACKEND_BASE_URL. The entrypoint cuts that out of
  # the URL into BACKEND_TARGET, which the scrape config names as
  # %{BACKEND_TARGET}; VictoriaMetrics substitutes it when it loads the file.
  # -maxLabelsPerTimeseries: vllm:cache_config_info carries 43 labels in
  # vLLM v0.34, over the default 40, and would be dropped.
  embeddings-gateway-victoriametrics:
    image: ${GATEWAY_VM_IMAGE}
    container_name: ${GATEWAY_VM_CONTAINER_NAME}
    restart: unless-stopped
    user: "${GATEWAY_RUN_AS}"
    ports:
      - "${GATEWAY_HOST}:${GATEWAY_VM_HTTP_PORT}:8428"
    environment:
      BACKEND_BASE_URL: ${GATEWAY_BACKEND_BASE_URL}
      RETENTION: ${GATEWAY_VM_RETENTION}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        target=$${BACKEND_BASE_URL#*://}
        export BACKEND_TARGET=$${target%%/*}
        echo "scraping engine at $$BACKEND_TARGET"
        exec /victoria-metrics-prod \
          -storageDataPath=/storage \
          -retentionPeriod=$$RETENTION \
          -promscrape.config=/etc/victoriametrics/scrape.yaml \
          -maxLabelsPerTimeseries=64 \
          -httpListenAddr=:8428
    extra_hosts:
      - "host.docker.gateway:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro

      # Data on NFS (GATEWAY_VM_VOLUME). Nothing is created on the host: a
      # missing mount fails the start instead of filling a fresh, empty
      # directory on the local disk.
      - type: bind
        source: ${GATEWAY_VM_VOLUME}
        target: /storage
        bind:
          create_host_path: false
    networks:
      - gateway

  embeddings-gateway-loki:
    image: ${GATEWAY_LOKI_IMAGE}
    container_name: ${GATEWAY_LOKI_CONTAINER_NAME}
    restart: unless-stopped
    user: "${GATEWAY_RUN_AS}"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${GATEWAY_HOST}:${GATEWAY_LOKI_HTTP_PORT}:3100"
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml:ro

      - type: bind
        source: ${GATEWAY_LOKI_VOLUME}
        target: /loki
        bind:
          create_host_path: false
    networks:
      - gateway

networks:
  gateway:
    driver: bridge
