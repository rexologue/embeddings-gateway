global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: embeddings-gateway
    metrics_path: /gateway/metrics
    static_configs:
      - targets: ["embeddings-gateway:8080"]

  # The engine, deploy/embeddings. __BACKEND_TARGET__ is host:port of
  # GATEWAY_BACKEND_BASE_URL, written in by the container's entrypoint
  # (docker-compose.yaml). Job name kept from the engine stack's own
  # Prometheus, which this one replaces, so dashboards match unchanged.
  - job_name: embeddings-vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["__BACKEND_TARGET__"]
